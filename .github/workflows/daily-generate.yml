name: Generate HIFDI Article

on:
  schedule:
    # 23:00 UTC = 06:00 WIB. SATU KALI SEHARI (pagi).
    # Jadwal kedua (11:00 UTC / 18:00 WIB) sengaja dihapus 3 Agustus 2026
    # atas keputusan pemilik repo — cukup satu artikel otomatis per hari.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Semua branch (origin/main + origin/draft) diperlukan untuk
          # menyinkronkan draft dengan main sebelum generate.
          fetch-depth: 0

      # ALUR DRAFT (keputusan Prinsipal 10 Agu 2026): artikel tidak langsung
      # tayang. Generate di branch `draft`, kirim isi draft ke Telegram,
      # lalu tunggu balasan ACC/TOLAK dari publish-on-acc.yml (tiap 5 menit).
      - name: Siapkan branch draft
        run: |
          git switch draft 2>/dev/null || git switch -c draft
          git merge --ff-only origin/main 2>/dev/null || git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # DeepSeek API OpenAI-compatible -> pakai SDK openai, bukan anthropic.
      # feedparser untuk menarik berita nyata dari RSS (grounding fakta).
      - name: Install dependencies
        run: pip install openai feedparser

      # TELEGRAM_* dipakai untuk lapor hasil + kirim caption WA ke Telegram.
      # Bot ini tidak bisa menyapa OpenWA (hidup di laptop, localhost), jadi
      # caption diteruskan manual dari Telegram ke WAG oleh pemilik repo.
      - name: Generate article
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_article.py

      # Penambahan spesifik, BUKAN git add -A — supaya file nyasar
      # (mis. wa-caption.txt) tidak ikut ter-commit. Sejalan dengan
      # keputusan no. 7 di AGENTS.md.
      # scripts/used_sources.json: penjaga duplikat (3 Agu 2026) — wajib
      # ikut ter-commit supaya penjaga berlaku lintas run.
      # stok/: draf Sekjen yang sudah dipindah ke article-XXX perlu "dihapus"
      # dari git (rename terlihat sebagai delete+add) — stok/ kosong tidak
      # menambah apa pun, jadi aman masuk git add.
      - name: Commit and push
        run: |
          git config user.name "HIFDI Bot"
          git config user.email "bot@hifdi.id"
          git add index.html images/ article-*/ stok/ scripts/used_sources.json scripts/photo_registry.json scripts/telegram_state.json
          git diff --cached --quiet || git commit -m "auto: draft artikel baru"
          git push origin draft
