name: Publish Draft on ACC

on:
  schedule:
    # Tiap 5 menit UTC — cek balasan ACC/TOLAK di Telegram
    # (keputusan Prinsipal 10 Agu 2026: artikel tayang setelah ACC).
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cek balasan ACC/TOLAK di Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publish_on_acc.py
