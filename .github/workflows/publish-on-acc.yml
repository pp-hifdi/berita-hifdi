name: Publish Draft on ACC

on:
  # PAUSED 11 Agu 2026: alur ACC dipindah ke Hermes (chat Prinsipal) —
  # token bot lama 401 & bentrok polling. Jalankan manual kalau perlu.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cek balasan ACC/TOLAK di Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publish_on_acc.py
